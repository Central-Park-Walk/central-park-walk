name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GODOT_VERSION: "4.6.1"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── Cache downloaded assets (models + textures from CC0 CDNs) ──

      - name: Cache downloaded assets
        uses: actions/cache@v4
        with:
          path: |
            models/
            textures/
          key: assets-${{ hashFiles('download_models.py', 'download_assets.py') }}

      - name: Download models
        run: python3 download_models.py

      - name: Download textures
        run: python3 download_assets.py

      - name: Generate placeholder sounds
        run: python3 download_sounds.py

      # ── Godot setup ──

      - name: Cache Godot export templates
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Install Godot
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          sudo install -m 755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          rm godot.zip "Godot_v${GODOT_VERSION}-stable_linux.x86_64"

      - name: Install export templates
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q templates.tpz -d /tmp/export-templates
          mv /tmp/export-templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm templates.tpz

      # ── Import + Export ──

      - name: Import project resources
        run: |
          # Godot's headless --import cannot do VRAM texture compression (no rendering device).
          # Pre-built .ctex files (S3TC + ETC2) are committed in prebuilt/terrain_ctex/.
          mkdir -p .godot/imported tmp
          cp prebuilt/terrain_ctex/* .godot/imported/
          echo "Installed $(ls .godot/imported/*.ctex 2>/dev/null | wc -l) pre-built terrain ctex files"
          # Run headless import for everything else (GLB scenes, SVG icons, etc.).
          # Godot's exit code is not a usable gate here: a headless import reports
          # errors for the VRAM compression it cannot do, so it can exit non-zero on
          # a perfectly good run. We keep the log and gate on ARTIFACTS instead --
          # a missing output file is unambiguous, a log line is not.
          godot --headless --import 2>&1 | tee -a tmp/import.log || true
          godot --headless --import 2>&1 | tee -a tmp/import.log || true
          echo "Total: $(ls .godot/imported/*.ctex 2>/dev/null | wc -l) ctex files after import"
          echo "--- import errors (informational; gates are below) ---"
          grep -i 'error' tmp/import.log | sort -u | head -30 || echo "(none)"
          # Verify terrain textures are present
          missing=0
          for f in textures/terrain3d/*.png; do
            base=$(basename "$f" .png)
            found=$(ls .godot/imported/${base}.png-*.ctex 2>/dev/null | wc -l)
            if [ "$found" -eq 0 ]; then
              echo "MISSING: no .ctex for $f"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo "ERROR: $missing terrain textures missing"
            exit 1
          fi
          echo "All terrain textures verified"
          # Verify compute shaders imported. A .glsl that fails to import yields no
          # .res and the export ships a sky/cloud pass that silently does nothing.
          shaders_missing=0
          for f in $(find . -name '*.glsl' -not -path './.godot/*'); do
            base=$(basename "$f")
            found=$(ls .godot/imported/${base}-*.res 2>/dev/null | wc -l)
            if [ "$found" -eq 0 ]; then
              echo "MISSING: no imported .res for $f"
              shaders_missing=$((shaders_missing + 1))
            fi
          done
          if [ "$shaders_missing" -gt 0 ]; then
            echo "ERROR: $shaders_missing compute shaders failed to import"
            exit 1
          fi
          echo "All compute shaders verified"

      - name: Run tests
        run: godot --headless --path . -s scripts/test_almanac.gd

      - name: Export Linux
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux" build/linux/central-park-walk.x86_64

      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows" build/windows/central-park-walk.exe

      - name: Export macOS
        run: |
          mkdir -p build/macos
          godot --headless --export-release "macOS" "build/macos/Central Park Walk.app"

      # ── Package ──

      - name: Package Linux
        run: |
          mkdir -p pkg-linux/central-park-walk
          cp build/linux/* pkg-linux/central-park-walk/
          chmod +x pkg-linux/central-park-walk/central-park-walk.x86_64
          cat > pkg-linux/central-park-walk/central-park-walk.sh << 'LAUNCH'
          #!/bin/bash
          cd "$(dirname "$0")"
          chmod +x central-park-walk.x86_64
          exec ./central-park-walk.x86_64 "$@"
          LAUNCH
          chmod +x pkg-linux/central-park-walk/central-park-walk.sh
          cat > pkg-linux/central-park-walk/README.txt << 'README'
          Central Park Walk
          =================

          Run:  ./central-park-walk.sh
          Or:   chmod +x central-park-walk.x86_64 && ./central-park-walk.x86_64

          Controls: WASD walk, right-click+mouse look, scroll wheel speed.
          Full controls: https://github.com/Central-Park-Walk/central-park-walk#controls

          Dedicated GPU recommended (Forward+ renderer).
          README
          cd pkg-linux
          tar czf ../central-park-walk-linux-x86_64.tar.gz central-park-walk

      - name: Package Windows
        run: |
          mkdir -p pkg-win/central-park-walk
          cp build/windows/* pkg-win/central-park-walk/
          cat > pkg-win/central-park-walk/README.txt << 'README'
          Central Park Walk
          =================

          Double-click central-park-walk.exe to play.

          Controls: WASD walk, right-click+mouse look, scroll wheel speed.
          Full controls: https://github.com/Central-Park-Walk/central-park-walk#controls

          Dedicated GPU recommended (Forward+ renderer).
          README
          cd pkg-win
          zip -qr ../central-park-walk-windows-x86_64.zip central-park-walk

      - name: Package macOS
        run: |
          mkdir -p pkg-mac
          cp -r "build/macos/Central Park Walk.app" pkg-mac/
          cat > pkg-mac/README.txt << 'README'
          Central Park Walk
          =================

          First launch (app is unsigned):
            Right-click "Central Park Walk.app" → Open → click "Open" in the dialog.

          Or from Terminal:
            xattr -cr "Central Park Walk.app"
            open "Central Park Walk.app"

          Controls: WASD walk, right-click+mouse look, scroll wheel speed.
          Full controls: https://github.com/Central-Park-Walk/central-park-walk#controls

          Dedicated GPU recommended (Forward+ renderer).
          README
          cd pkg-mac
          zip -qr ../central-park-walk-macos-universal.zip "Central Park Walk.app" README.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            central-park-walk-linux-x86_64.tar.gz
            central-park-walk-windows-x86_64.zip
            central-park-walk-macos-universal.zip

      # ── Release (tag pushes only) ──

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            central-park-walk-linux-x86_64.tar.gz
            central-park-walk-windows-x86_64.zip
            central-park-walk-macos-universal.zip
          generate_release_notes: true
          draft: false
