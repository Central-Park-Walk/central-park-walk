// FROZEN 2026-07-04 (Chris approved — Phase 1 re-run, 3-oak gate passed).
// Scope: THREE oaks per `docs/oaks prompt.txt` — Pin (Q. palustris), Red (Q. rubra),
// Turkey (Q. cerris). Supersedes the 2026-06-24 7-taxon freeze (scarlet/white/
// swamp-white/sawtooth dropped as scope-creep; their dossiers archived under
// _superseded_7taxon/). Harvested from that schema; the section/archetype enums and
// consolidation pools were re-scoped to the 3-oak roster, and the census `in_census`
// boolean was replaced by a two-dataset abundance structure (street census vs
// Central Park Entire field survey) after the 2026-07-04 Q. cerris population audit.
//
// Every oak fills this structure identically as oak_<key>.yaml. Rules (from the
// pipeline brief): proportions over absolutes, cite every measurement, FLAG conflicts
// — never average blindly. Phase 2 establishes the Lobatae baseline once (Red), then
// Pin records DELTAS against it; Turkey (Cerris) is its own standalone baseline.
//
// PIN THIS: Turkey oak = Quercus cerris (European, section Cerris). NOT Q. laevis
// (American scrub/turkey oak) — entirely different leaves.
//
// (YAML body below; this header is comment-style for readability only.)

taxon:
  common_name:          # Pin oak | Northern red oak | Turkey oak
  binomial:             # Quercus palustris | Q. rubra | Q. cerris
  section:              # Lobatae (pin, red) | Cerris (turkey)
  archetype_key: oak    # current runtime SPECIES_MAP slot (all oaks today)

abundance:
  # TWO INDEPENDENT POPULATION DATASETS — keep BOTH; NEVER collapse to one number.
  # (A boolean `in_census` did exactly that and mis-tiered Turkey oak — 2026-07-04 audit.)
  # Citations in provenance.population_sources.
  nyc_street_census:              # ON-DISK source: convert_to_godot.py SPECIES_MAP + park_data.json
    covers_central_park: false    # NYC Street Tree Census maps STREET trees — EXCLUDES the park interior
    resolution: genus             # aggregates all Quercus to genus (2,613) — NO per-species oak count
    species_count: null           # not distinguishable in this dataset for ANY oak
  park_field_survey:              # Central Park Entire / Chaya–Barnard 2013 (per-species, park-specific, cited)
    present:                      # true | false — is this species in the park per the field survey?
    species_count:                # per-species count (e.g. Turkey oak 356)
    rank:                         # rank among park oaks if notable (e.g. "3rd of 18 oak species")
    park_oak_total: 2854          # shared constant: 2,854 oaks / 18 spp in the 2013 survey
  scatter_weight:                 # per-zone placement weight (genus-level, from on-disk census) or null
  prominence:                     # stood-under | passed-at-distance | accent (sets fidelity tier)
  park_locations:                 # zones it lives in

form:
  mature_height_m:    [ , ]
  mature_spread_m:    [ , ]
  height_to_spread:             # ratio — the silhouette proportion that reads at distance
  dbh_range_cm:       [ , ]
  branching_habit:              # excurrent(central leader) | decurrent(rounded/spreading)
  crown_silhouette:             # one falsifiable sentence
  crown_density_bucket:         # opaque | moderate/dappled | open (tie to LAI)
  lai:                          # leaf area index if known

bark:
  near_L0:                      # character + color, stood-under distance
  shader_style:                 # furrowed | smooth | exfoliating | plate (tree_bark.gdshader)
  distinctive:                  # bool — does bark separate this oak near?

leaf:
  archetype:                    # lobed-bristle (Lobatae: pin, red) | toothed (Cerris: turkey)
  reference_image:              # path to flat-on-white / wire-mesh ref it's measured from
  length_cm:          [ , ]
  width_cm:           [ , ]
  length_to_width:              # proportion (transfers to any target size)
  lobe_or_tooth_count:          # lobes/side (Lobatae) or teeth/side (Cerris)
  sinus_depth_frac:             # sinus depth / half-blade-width (0 entire .. ~0.9 deep)
  lobe_tip:                     # bristle-pointed | toothed
  bristle_tips:                 # y | n
  margin:                       # bristle-lobed (Lobatae) | triangular-toothed (Cerris)
  phyllotaxy: alternate         # confirm per species
  shape_resolves_at_m:          # distance beyond which leaf SHAPE stops resolving (~30 m)

color:
  summer:                       # mass color (hex or descriptor)
  fall_curve:                   # ordered states + timing (e.g. green→russet→brown, late-Oct–Nov)
  fall_signature:               # the color that says "this species"
  winter_marcescence:           # bool — holds dead leaves? (some oaks do)
  winter_retention_frac:        # literal card fraction held (feeds WINTER_RETENTION)

fruit:
  acorn:                        # size, cap coverage
  cupule:                       # scaly (Lobatae) | mossy/whiskered (Cerris) — near-only cue
  note:

# THE RESEARCH DELIVERABLE — per-LOD-tier discriminability vs the OTHER two oaks.
# Drives the "distinct geometry vs shared+texture vs consolidate" call in Phase 2.
# Answer PER TIER (near/L0 vs mid/lod1 vs far/impostor), never as one global call.
representation:
  discriminators:
    near_L0:                    # what separates this oak < ~30 m (leaf / bark / acorn)
    mid_lod1:                   # what separates it ~30–200 m (crown shape, density, fall color)
    far_impostor:               # what separates it > ~200 m (silhouette, color mass)
  legible_to_m:                 # distance each discriminator stops being legible
  shared_skeleton_candidates:   # of {pin, red, turkey} — which it could share a SKELETON with
  shared_leaf_card_candidates:  # of {pin, red, turkey} — which it could share a LEAF CARD with
  tiers_needed:                 # s/m/l + which LODs per existing TIER_BOUNDS

mtree_hints:
  branch_angle:
  trunk_frac:
  sub_density:
  gravity:
  leaf_scale:
  leaf_density:
  known_mesher_crashes:         # ceilings to respect (memory mtree_pipeline)
  notes:

sources:                        # cited, credibility-ranked; conflicts flagged not averaged
  - { claim: , value: , source: , confidence: }
conflicts:                      # ambiguous/contradictory data — list, do NOT average
provenance:
  filled_by:
  date:
  baseline_deltas_only:         # red=false(baseline); pin=true(vs red); turkey=false(own Cerris baseline)
  population_sources:           # keep BOTH datasets distinct forever (2026-07-04 audit)
    nyc_street_census: "on-disk: convert_to_godot.py SPECIES_MAP + park_data.json — NYC Street Tree Census, genus-aggregated (Quercus=2,613), EXCLUDES the Central Park interior. Cannot distinguish oak species; not a park population."
    park_field_survey: "Ken Chaya & Edward Sibley Barnard, *Central Park Entire: The Definitive Illustrated Map* (2013) — 19,600+ trees, 173 species individually field-mapped over 2 yr. Oak breakdown (2,854 oaks, 18 spp) via Roderick Cameron, 'A New Map of New York's Central Park,' International Oak Society, 2014-05-25: https://www.internationaloaksociety.org/content/new-map-new-york%27s-central-park . Turkey oak = 356 (3rd most populous). NOTE: 2013 point-in-time FIELD census, not a live DB; predates any post-2013 loss/planting; independent ground-truth, not modeled data."
