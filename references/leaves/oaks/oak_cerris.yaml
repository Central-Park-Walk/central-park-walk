# Turkey oak — section CERRIS, standalone Cerris baseline (3-oak scope). Schema: SCHEMA.yaml (FROZEN 2026-07-04).
# ▲ PIN: Turkey oak = Quercus CERRIS (European, section Cerris). NOT Q. laevis (American scrub/turkey oak).
# ▲ POPULATION (2026-07-04 audit): 356 in park / 3rd most populous oak (Central Park Entire 2013) → DISTINCT
#   geometry. Absent from the on-disk NYC street census ONLY because that dataset excludes the park interior.
# ⏳ follow_up (TRACKED, do NOT fix this pass): the old census_basis "may double as the in-census Sawtooth oak
#   model" cross-ref is stale (sawtooth archived out of 3-oak scope) — reconcile in Phase 2.

taxon:
  common_name: Turkey oak (Turkish oak)
  binomial: Quercus cerris
  section: Cerris
  archetype_key: oak

abundance:
  # TWO datasets — see provenance.population_sources. Populous in the PARK survey, invisible to
  # the on-disk street census (which excludes the park interior). Do NOT collapse to one number.
  nyc_street_census:
    covers_central_park: false     # street census excludes the park interior
    resolution: genus              # Quercus aggregated to genus (2,613); no per-species count
    species_count: null            # cerris not distinguishable on-disk — coverage gap, NOT rarity
  park_field_survey:
    present: true
    species_count: 356             # Central Park Entire (2013)
    rank: "3rd most populous oak (of 18 spp; after pin ≈half of 2,854, red 584)"
    park_oak_total: 2854
  scatter_weight: null             # no on-disk weight (absent from street census); placement TBD Phase 3
  prominence: stood-under          # 356 individuals → a genuinely encountered park oak → full fidelity
  park_locations: "per Central Park Entire (2013); specific zones to map in Phase 3 from the survey."

form:                              # ▲ DELTA vs sawtooth: LARGER, conical-young → dense-rounded
  mature_height_m: [25, 40]        # 82-131 ft — much larger than sawtooth
  mature_spread_m: [18, 30]
  height_to_spread: ~1.3
  dbh_range_cm: [60, 200]
  branching_habit: decurrent (conical at first, later broad rounded; dense crown)
  crown_silhouette: "dense, broad rounded crown (conical when young); big — reads as a large rounded oak at distance"
  crown_density_bucket: dense
  lai: 4-6

bark:                              # ▲ DELTA: distinctive deep fissures with ORANGE in the cracks
  near_L0: "dark gray-brown, thick, with deep fissures and rough plates; ORANGE-tan colour shows in the fissures near the base — the one bark genuinely worth a per-species tint"
  shader_style: "furrowed/plate with orange fissure tint"
  distinctive: true

leaf:                              # ▲ DELTA vs sawtooth: shallowly LOBED-toothed (not pure serrate)
  archetype: toothed-narrow        # shares the Cerris card (slightly more lobed than sawtooth)
  reference_image: "reference_photos/pin oak/Austrian_oak_Quercus_cerris_1_1000_0002.jpg (a 3D-model wireframe labelled cerris — silhouette/branch cross-check only, NOT a leaf ref)"
  length_cm: [5, 12]
  width_cm: [1.5, 3]
  length_to_width: ~3.5            # narrow oblong
  lobe_or_tooth_count: "margin shallowly LOBED, lobes ending in triangular bristle teeth (between sawtooth-serrate and Lobatae-lobed)"
  sinus_depth_frac: 0.2            # shallow lobing — more cut than sawtooth (0.05), far less than Lobatae
  lobe_tip: triangular bristle-toothed
  bristle_tips: y
  margin: "shallow-lobed with triangular bristle teeth; variable/polymorphic"
  phyllotaxy: alternate
  shape_resolves_at_m: ~30

color:
  summer: dark green above, gray-felted paler below
  fall_curve: "green → pale YELLOW-GOLD (little colour); drops late"
  fall_signature: "pale yellow-gold, muted; MARCESCENT on young trees"
  winter_marcescence: yes (young trees hold leaves into spring)
  winter_retention_frac: 0.50      # high (young) — like sawtooth

fruit:
  acorn: "to 35 mm, ellipsoid, olive-brown; cup ⅓-½ with spreading/reflexed mossy scales ('moss-cupped oak')"
  cupule: "mossy/whiskered (Cerris signature); buds surrounded by long twisted whisker-stipules"
  note:

representation:
  discriminators:
    near_L0: "narrow shallow-lobed bristle-toothed leaf + ORANGE-fissured bark + whiskered mossy acorn cup"
    mid_lod1: "large dense rounded crown + pale gold fall + winter retention"
    far_impostor: "large rounded silhouette + gold color mass"
  legible_to_m: { leaf: 30, crown_form: 200, fall_color: 400 }
  shared_skeleton_candidates: []        # ▲ DISTINCT — its own Skeleton C (large Cerris); NOT folded into A
  shared_leaf_card_candidates: []        # own Cerris bristle-toothed card (sawtooth archived out of scope)
  tiers_needed: "s/m/l, full LOD0+LOD1+impostor (matches pin/red — see FIDELITY_CALL.md 'Turkey oak tier note')"
  tiers_rationale: "s/m/l NOT m/l-only. No park size-distribution data exists for the 356 → default to pin/red's s/m/l. The old m/l-only was a carried-over artifact of the dead sawtooth-covers-small-tier consolidation (archived), not a data call. Keep _s: young-tree marcescence + Cerris card make a Turkey sapling read distinct from a red sapling near-range; tree_builder routes any oak <12m to _s. Cost = one extra skeleton variant."
  distinct_geometry_rationale: "REVERSED 2026-07-04: 356 individuals / 3rd most populous park oak (Central Park Entire 2013) warrants its OWN skeleton + Cerris card + orange-fissured bark. The prior 'STRONGEST consolidation candidate / accent / sawtooth re-skin' call was based on the on-disk NYC street census, which EXCLUDES the park interior and so couldn't see cerris — a dataset-coverage artifact, not low abundance."

mtree_hints:
  branch_angle: ~55
  trunk_frac: 0.28
  sub_density: 1.7 (dense)
  gravity: low
  leaf_scale: 0.9 (narrow leaf)
  leaf_density: 0.7
  known_mesher_crashes: "see memory mtree_pipeline; dense large crown — watch sub_density at _l scale"
  notes: "Its OWN large-Cerris skeleton (conical-young → broad rounded dense); orange-fissured bark + Cerris bristle-toothed card are Turkey-specific. Distinct model justified by the 356/3rd-most-populous park count, not consolidated."

sources:
  - { claim: "25-40 m tall, conical-young→rounded dense crown; oblong leaf 5-12cm × 1.5-3cm shallow-lobed with triangular bristle teeth; pale yellow-gold late fall, marcescent young; mossy/whiskered acorn cup ⅓-½; bark deep-fissured grey-brown with orange in fissures", value: see-above, source: "Wikipedia Quercus cerris; Woodland Trust; NC State Extension; Trees & Shrubs Online; Oregon State Landscape Plants", confidence: high }
  - { claim: "Turkey oak = 356 individuals, 3rd most populous oak in Central Park (of 2,854 oaks / 18 spp)", value: 356, source: "Chaya & Barnard, Central Park Entire (2013) field survey — via R. Cameron, 'A New Map of New York's Central Park,' International Oak Society, 2014-05-25, https://www.internationaloaksociety.org/content/new-map-new-york%27s-central-park", confidence: high }
conflicts:
  - "Section-Cerris PIN confirmed across all sources — Q. cerris is the European Turkey oak, distinct from American Q. laevis. No on-disk doc implied otherwise."
  - "APPARENT-ONLY (RESOLVED, not a real conflict): on-disk NYC street census shows cerris absent / genus-only, while Central Park Entire shows 356. Two different datasets — the street census excludes the park interior. Keep BOTH; the park field survey governs fidelity. Do NOT average or collapse."
provenance:
  filled_by: Claude (Phase 2); population corrected 2026-07-04 audit
  date: 2026-06-24 (pop. 2026-07-04)
  baseline_deltas_only: false      # ▲ now the STANDALONE Cerris baseline (sawtooth archived out of scope)
  population_sources:
    nyc_street_census: "on-disk (convert_to_godot.py + park_data.json): NYC Street Tree Census, genus-aggregated, EXCLUDES Central Park interior — cannot see cerris by species."
    park_field_survey: "Chaya & Barnard, Central Park Entire (2013), via Cameron/Intl Oak Society 2014-05-25 (URL above): Turkey oak 356, 3rd most populous park oak. Field ground-truth, 2013 point-in-time."
