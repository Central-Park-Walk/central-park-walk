  - { claim: "5-7 lobes, deep U-shaped sinuses ~= blade area; russet-red fall, marcescent young; small ½-¾in acorn shallow saucer cap", value: see-above, source: "NC State Extension; Ohio DNR; USDA NRCS factsheet", confidence: high }
